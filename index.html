<script>
    gsap.registerPlugin(ScrollTrigger);

    document.addEventListener("DOMContentLoaded", () => {

        /* ==============================
           STICKY HEADER
        ============================== */

        const mainHeader = document.getElementById('main-header');
        const headerNavList = document.getElementById('header-nav-list');

        const updateHeader = () => {

            if (window.scrollY > 10) {

                /* HEADER DEPOIS DE ROLAR */
                mainHeader.classList.add(
                    'bg-white/95',
                    'backdrop-blur-sm',
                    'shadow-sm',
                    'py-4'
                );

                mainHeader.classList.remove(
                    'bg-transparent',
                    'pt-4',
                    'md:pt-8',
                    'pb-4'
                );

                if (headerNavList) {
                    headerNavList.classList.remove('text-white');
                    headerNavList.classList.add('text-brand-black');
                }

            } else {

                /* HEADER NO TOPO DO BANNER */
                mainHeader.classList.remove(
                    'bg-white/95',
                    'backdrop-blur-sm',
                    'shadow-sm',
                    'py-4'
                );

                mainHeader.classList.add(
                    'bg-transparent',
                    'pt-4',
                    'md:pt-8',
                    'pb-4'
                );

                if (headerNavList) {
                    headerNavList.classList.remove('text-brand-black');
                    headerNavList.classList.add('text-white');
                }

            }
        };


        updateHeader();

        window.addEventListener(
            'scroll',
            updateHeader,
            { passive: true }
        );


        /* ==============================
           ANIMAÇÕES GSAP
        ============================== */

        gsap.from(".group", {

            scrollTrigger: {
                trigger: ".grid-cols-1.md\\:grid-cols-3",
                start: "top 80%",
            },

            y: 30,
            opacity: 0,
            duration: 0.8,
            stagger: 0.1,
            ease: "power2.out"
        });


        /* ==============================
           MODAL WHATSAPP
        ============================== */

        const waTriggers =
            document.querySelectorAll(
                'a[href*="wa.me"]:not(.wa-route-btn)'
            );

        const waModal =
            document.getElementById('wa-modal');

        const waModalContent =
            document.getElementById('wa-modal-content');

        const waCloseBtn =
            document.getElementById('wa-close');

        const waRouteBtns =
            document.querySelectorAll('.wa-route-btn');


        const openModal = (e) => {

            e.preventDefault();

            if (!waModal || !waModalContent)
                return;

            waModal.classList.remove('hidden');

            setTimeout(() => {

                waModal.classList.remove('opacity-0');

                waModalContent.classList.remove(
                    'scale-95'
                );

                waModalContent.classList.add(
                    'scale-100'
                );

            }, 10);

        };


        const closeModal = () => {

            if (!waModal || !waModalContent)
                return;

            waModal.classList.add('opacity-0');

            waModalContent.classList.remove(
                'scale-100'
            );

            waModalContent.classList.add(
                'scale-95'
            );

            setTimeout(() => {

                waModal.classList.add('hidden');

            }, 300);

        };


        waTriggers.forEach(trigger => {

            trigger.addEventListener(
                'click',
                openModal
            );

        });


        if (waCloseBtn) {

            waCloseBtn.addEventListener(
                'click',
                closeModal
            );

        }


        if (waModal) {

            waModal.addEventListener(
                'click',
                (e) => {

                    if (e.target === waModal) {
                        closeModal();
                    }

                }
            );

        }


        waRouteBtns.forEach(btn => {

            btn.addEventListener(
                'click',
                closeModal
            );

        });

    });
</script>
